name: Build and deploy board PDFs

on:
  push:
    branches:
      - main
    paths:
      - "板子/**"
      - "scripts/build-board-pdfs.sh"
      - "scripts/prepare-markdown.mjs"
      - "scripts/generate-board-index.mjs"
      - "scripts/pdf-header.tex"
      - ".github/workflows/build-board-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: pandoc/latex:3.10-ubuntu
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PDF tools and Chinese fonts
        run: |
          apt-get update
          env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            nodejs \
            fonts-noto-cjk \
            poppler-utils
          fc-cache -f

          tex_log=$(mktemp)
          if ! {
            tlmgr update --self
            tlmgr install xecjk fvextra
          } >"$tex_log" 2>&1; then
            tex_error=$(tail -n 20 "$tex_log" | tr '\n' ' ' | cut -c1-1800)
            tex_error="${tex_error//'%'/'%25'}"
            echo "::error title=TeX package installation failed::$tex_error"
            cat "$tex_log" >&2
            rm -f -- "$tex_log"
            exit 1
          fi
          cat "$tex_log"
          rm -f -- "$tex_log"

      - name: Build PDFs
        run: bash scripts/build-board-pdfs.sh

      - name: Verify generated PDFs
        run: |
          markdown_count=$(find "板子" -type f -name '*.md' | wc -l)
          pdf_count=$(find "_site/板子" -type f -name '*.pdf' | wc -l)
          test "$markdown_count" -eq "$pdf_count"

          while IFS= read -r -d '' pdf; do
            pdfinfo "$pdf" >/dev/null
          done < <(find "_site/板子" -type f -name '*.pdf' -print0)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
