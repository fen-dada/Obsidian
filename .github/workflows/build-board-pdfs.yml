name: Build and deploy board PDFs

on:
  push:
    branches:
      - main
    paths:
      - "板子/**"
      - "scripts/build-board-pdfs.sh"
      - "scripts/prepare-markdown.mjs"
      - "scripts/generate-board-index.mjs"
      - "scripts/pdf-header.tex"
      - ".github/workflows/build-board-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: pandoc/latex:3.10-ubuntu
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PDF tools and Chinese fonts
        run: |
          apt-get update
          env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            nodejs \
            fonts-noto-cjk \
            poppler-utils
          fc-cache -f
          tlmgr option repository https://ftp.tug.org/historic/systems/texlive/2025/tlnet-final
          tlmgr install xecjk fvextra

      - name: Build PDFs
        run: bash scripts/build-board-pdfs.sh

      - name: Verify generated PDFs
        run: |
          markdown_count=$(find "板子" -type f -name '*.md' | wc -l)
          pdf_count=$(find "_site/板子" -type f -name '*.pdf' | wc -l)
          test "$markdown_count" -eq "$pdf_count"

          while IFS= read -r -d '' pdf; do
            pdfinfo "$pdf" >/dev/null
          done < <(find "_site/板子" -type f -name '*.pdf' -print0)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
