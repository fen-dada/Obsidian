name: Build and deploy board PDFs

on:
  push:
    branches: [main]
    paths: ["板子/**", "scripts/**", ".github/workflows/build-board-pdfs.yml"]
  pull_request:
    paths: ["板子/**", "scripts/**", ".github/workflows/build-board-pdfs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Use one distribution's TeX packages, without the rolling tlmgr mirror.
      - name: Install PDF tools and Chinese fonts
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended \
            lmodern fonts-noto-cjk poppler-utils python3-pypdf python3-reportlab
          fc-cache -f
          pandoc --version | head -n 1
          xelatex --version | head -n 1

      - name: Build and verify printable PDFs
        run: bash scripts/build-board-pdfs.sh

      # Downloads remain available even when Pages deployment fails.
      - name: Save printable PDFs
        uses: actions/upload-artifact@v4
        with:
          name: board-pdfs
          path: _site
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
